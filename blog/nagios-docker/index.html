  <script>
    const markdownTarget = document.getElementById('blog-article-content');
    const markdownUrl = '../../content/blog/nagios-docker.md';

    const enhanceArticleContent = (container) => {
      if (!container) return;

      container.querySelectorAll('table').forEach((table) => {
        if (table.parentElement?.classList.contains('table-scroll')) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'table-scroll';
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });
    };

    fetch(markdownUrl)
      .then((response) => {
        if (!response.ok) {
          throw new Error('Erreur lors du chargement de l’article');
        }
        return response.text();
      })
      .then((markdown) => {
        if (window.marked) {
          markdownTarget.innerHTML = marked.parse(markdown);
          enhanceArticleContent(markdownTarget);
        } else {
          markdownTarget.textContent = markdown;
        }
      })
      .catch(() => {
        markdownTarget.innerHTML = '<p>Impossible de charger l’article pour le moment.</p>';
      });
  </script>

name: Update Cyber Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build cyber feed JSON
        run: npm run build:cyber-feed
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cyber-feed.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update cyber feed data"
          git push
